# terraform-docs configuration for an example.
# Generates the tables between the BEGIN_TF_DOCS / END_TF_DOCS markers in README.md.
# The text above the markers is written by hand.
formatter: "markdown table"

version: ">= 0.20.0, < 1.0.0"

sections:
  show:
    - requirements
    - providers
    - modules
    - resources
    - inputs
    - outputs

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: required

settings:
  anchor: true
  default: true
  escape: true
  hide-empty: true
  html: true
  indent: 2
  lockfile: false
  read-comments: true
  required: true
  sensitive: true
  type: true
